[workspace]
resolver = "2"
members = [
    "crates/oxirpc-core",
    "crates/oxirpc-build",
    "crates/oxirpc-client",
    "crates/oxirpc-server",
    "crates/oxirpc",
    "crates/oxirpc-reflect",
    "crates/oxirpc-web",
    "crates/oxirpc-health",
    "crates/oxirpc-adapter-aws-lc",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxirpc"
description = "Pure-Rust gRPC stack — no protoc, no openssl, no ring by default."

[workspace.dependencies]
# workspace internal
oxirpc-core             = { path = "crates/oxirpc-core",             version = "0.1.2" }
oxirpc-build            = { path = "crates/oxirpc-build",            version = "0.1.2" }
oxirpc-client           = { path = "crates/oxirpc-client",           version = "0.1.2" }
oxirpc-server           = { path = "crates/oxirpc-server",           version = "0.1.2" }
oxirpc-reflect          = { path = "crates/oxirpc-reflect",          version = "0.1.2" }
oxirpc-web              = { path = "crates/oxirpc-web",              version = "0.1.2" }
oxirpc-health           = { path = "crates/oxirpc-health",           version = "0.1.2" }
oxirpc-adapter-aws-lc   = { path = "crates/oxirpc-adapter-aws-lc",  version = "0.1.2" }

# tonic 0.14 (no "prost" feature; use codegen + transport)
# CRITICAL: do NOT enable deflate/gzip/zstd — those pull flate2/zstd
tonic            = { version = "0.14", default-features = false, features = ["transport", "codegen", "server", "channel", "router"] }
tonic-prost      = { version = "0.14" }
tonic-reflection = { version = "0.14.6" }
tonic-web        = { version = "0.14.6" }
tonic-health     = { version = "0.14.6", default-features = false }

# build-time codegen (no protoc)
tonic-prost-build = { version = "0.14" }
protox            = { version = "0.9.1" }
miette            = { version = "7", features = ["fancy"] }

prost        = { version = "0.14.3" }
prost-types  = { version = "0.14.3" }

http         = { version = "1.4.1" }
axum         = { version = "0.8", default-features = false }
tower        = { version = "0.5.3", features = ["full"] }
tower-layer  = { version = "0.3.3" }
tower-service = { version = "0.3.3" }
tokio        = { version = "1", features = ["full"] }
tokio-stream  = { version = "0.1.18", features = ["net"] }
tokio-rustls  = { version = "0.26", default-features = false }
futures-core  = { version = "0.3.32" }
hyper         = { version = "1" }
hyper-util    = { version = "0.1", features = ["tokio"] }
bytes         = { version = "1" }
http-body     = { version = "1" }
http-body-util = { version = "0.1" }

# oxiproto deps
oxiproto         = { version = "0.1.2" }
oxiproto-reflect = { version = "0.1.2" }
oxiproto-build   = { version = "0.1.2", default-features = false }
oxiproto-core    = { version = "0.1.2" }

# compression (M5/7a) — Pure Rust gzip via OxiArc Deflate; no flate2, no zstd
oxiarc-deflate = { version = "0.3.3" }
# compression (zstd) — Pure Rust Zstandard via OxiArc; no zstd C crate
oxiarc-zstd    = { version = "0.3.3" }

# TLS (M2) — Pure Rust via OxiTLS + rustls-rustcrypto; no ring, no aws-lc-rs, no native-tls
oxitls         = { version = "0.1.2", default-features = false, features = ["pure"] }
rustls         = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = { version = "2.2" }
rustls-pki-types = { version = "1" }
# rcgen is dev-only — appears only in [dev-dependencies], never in normal edges.
# ring feature is enabled here because rcgen needs a crypto backend to generate certs.
# Since rcgen is only used in dev-dependencies, ring does NOT appear on normal edges
# and therefore does NOT violate the FFI audit (cargo tree --edges normal).
rcgen          = { version = "0.14" }
criterion      = { version = "0.8", features = ["html_reports"] }
filetime       = { version = "0.2.29" }
thiserror      = { version = "2" }
tokio-util     = { version = "0.7", features = ["codec"] }
h2             = { version = "0.4" }
futures-util   = { version = "0.3" }
pin-project-lite = { version = "0.2" }
async-stream   = { version = "0.3" }
tracing        = { version = "0.1" }
