[package]
name = "oxirpc-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OxiRPC server: plaintext server builder with graceful shutdown"
keywords = ["grpc", "server", "tonic", "pure-rust", "oxirpc"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
tls = [
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:async-stream",
    "dep:tracing",
    "oxirpc-core/tls",
    "tonic/tls-connect-info",
]
native = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tracing",
    "dep:bytes",
    "dep:http-body",
    "dep:pin-project-lite",
]
reflect = [
    "dep:oxirpc-reflect",
    "dep:bytes",
]
health = [
    "dep:oxirpc-health",
]

[dependencies]
oxirpc-core  = { workspace = true }
tonic        = { workspace = true }
tokio        = { workspace = true }
tokio-stream = { workspace = true }
tower        = { workspace = true }
http         = { workspace = true }
axum         = { workspace = true }
futures-core = { workspace = true }

[dependencies.bytes]
workspace = true
optional = true

[dependencies.oxirpc-reflect]
workspace = true
optional = true

[dependencies.oxirpc-health]
workspace = true
optional = true

[dependencies.http-body]
workspace = true
optional = true

[dependencies.tokio-rustls]
workspace = true
optional = true

[dependencies.rustls]
workspace = true
optional = true

[dependencies.async-stream]
workspace = true
optional = true

[dependencies.tracing]
workspace = true
optional = true

[dependencies.hyper]
workspace = true
features = ["http2", "server"]
optional = true

[dependencies.hyper-util]
workspace = true
features = ["tokio"]
optional = true

[dependencies.http-body-util]
workspace = true
optional = true

[dependencies.pin-project-lite]
workspace = true
optional = true

[dev-dependencies]
oxirpc-health      = { path = "../oxirpc-health" }
oxirpc-reflect     = { path = "../oxirpc-reflect" }
oxirpc-core        = { path = "../oxirpc-core", features = ["tls"] }
oxirpc-client      = { path = "../oxirpc-client", features = ["tls"] }
tonic-health       = { workspace = true }
tonic-prost        = { workspace = true }
tonic-reflection   = { workspace = true }
rcgen              = { workspace = true }
tokio              = { workspace = true }
prost              = { workspace = true }
prost-types        = { workspace = true }
rustls             = { workspace = true }
rustls-pemfile     = { workspace = true }
rustls-pki-types   = { workspace = true }
tokio-rustls       = { workspace = true }
hyper-util         = { workspace = true }
criterion          = { workspace = true }
bytes              = { workspace = true }

[[test]]
name = "native_registry"
required-features = ["native"]

[[bench]]
name = "server_bench"
harness = false

[[bench]]
name = "high_conn_memory"
harness = false
