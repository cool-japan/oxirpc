[package]
name = "oxirpc-reflect"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC server reflection (v1 + v1alpha) wrapper for OxiRPC"
keywords = ["grpc", "reflection", "tonic", "pure-rust", "cooljapan"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
gzip    = ["oxirpc-core/gzip"]
zstd    = ["oxirpc-core/zstd"]
# Enable the oxiproto-reflect DescriptorPool backend for the native reflection service.
oxiproto = ["dep:oxiproto-reflect"]

[dependencies]
tonic-reflection  = { workspace = true }
tonic             = { workspace = true }
prost             = { workspace = true }
prost-types       = { workspace = true }
tokio-stream      = { workspace = true }
futures-core      = { workspace = true }
tower             = { workspace = true }
http              = { workspace = true }
http-body         = { workspace = true }
bytes             = { workspace = true }
oxirpc-core       = { workspace = true }
http-body-util    = { workspace = true }
tokio             = { workspace = true }
# optional: oxiproto-reflect DescriptorPool backend (feature = "oxiproto")
oxiproto-reflect  = { workspace = true, optional = true }

[dev-dependencies]
prost       = { workspace = true }
prost-types = { workspace = true }
tokio       = { workspace = true }
criterion   = { workspace = true }

[[bench]]
name    = "reflect_bench"
harness = false

[[bench]]
name    = "leaked_fds_memory"
harness = false
