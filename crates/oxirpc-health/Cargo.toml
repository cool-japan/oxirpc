[package]
name = "oxirpc-health"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC Health Checking (v1) service wrapper for OxiRPC"
keywords = ["grpc", "health", "tonic", "pure-rust", "cooljapan"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
gzip = ["oxirpc-core/gzip"]
zstd = ["oxirpc-core/zstd"]

[dependencies]
tonic          = { workspace = true }
tonic-health   = { workspace = true }
tokio          = { workspace = true, features = ["sync", "rt", "time"] }
tokio-stream   = { workspace = true }
http           = { workspace = true }
tower          = { workspace = true }
prost          = { workspace = true }
bytes          = { workspace = true }
oxirpc-core    = { workspace = true }
http-body      = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["full", "test-util"] }
prost          = { workspace = true }
prost-types    = { workspace = true }
tonic-prost    = { workspace = true }
http           = { workspace = true }
http-body-util = { workspace = true }
tower          = { workspace = true }
bytes          = { workspace = true }
tokio-stream   = { workspace = true }
criterion      = { workspace = true }
oxirpc-core    = { workspace = true }
# temporarily removed for publish (circular/forward dev-dep); restore after publish complete
# oxirpc-reflect = { workspace = true }
# oxirpc-web     = { workspace = true }

[[bench]]
name    = "health_bench"
harness = false

[[bench]]
name    = "memory_bench"
harness = false
