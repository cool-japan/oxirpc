[package]
name = "oxirpc-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "gRPC-Web bridge layer for OxiRPC (base64 framing + CORS headers)"
keywords = ["grpc", "grpc-web", "tonic", "pure-rust", "cooljapan"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
gzip        = ["oxirpc-core/gzip"]
zstd        = ["oxirpc-core/zstd"]
compression = ["oxirpc-core/compression"]

[dependencies]
oxirpc-core    = { workspace = true }
tonic-web      = { workspace = true }
tonic          = { workspace = true }
tower          = { workspace = true }
tower-layer    = { workspace = true }
http           = { workspace = true }
bytes          = { workspace = true }
http-body      = { workspace = true }
http-body-util = { workspace = true }
tokio          = { workspace = true }
futures-util   = { workspace = true }

[dependencies.hyper]
workspace = true
features = ["http1", "http2", "server"]

[dependencies.hyper-util]
workspace = true
features = ["tokio", "server", "server-auto"]

[dependencies.tracing]
workspace = true

[dev-dependencies]
tonic          = { workspace = true }
tokio          = { workspace = true }
oxirpc-health  = { path = "../oxirpc-health" }
oxirpc-reflect = { path = "../oxirpc-reflect" }
prost          = { workspace = true }
prost-types    = { workspace = true }
criterion      = { workspace = true }
bytes          = { workspace = true }
http-body-util = { workspace = true }
http           = { workspace = true }
oxirpc-core    = { path = "../oxirpc-core" }

[dev-dependencies.hyper]
workspace = true
features = ["http1", "http2", "client", "server"]

[dev-dependencies.hyper-util]
workspace = true
features = ["tokio", "server", "server-auto"]

[[bench]]
name    = "web_bench"
harness = false

[[bench]]
name    = "frame_alloc_memory"
harness = false
